services:
  agent-compose:
    image: ${AGENT_COMPOSE_IMAGE:-chaitin/agent-compose:latest}
    container_name: agent-compose
    restart: always
    environment:
      AGENT_COMPOSE_RUNTIME_BASE_URL: ${AGENT_COMPOSE_RUNTIME_BASE_URL:-http://agent-compose:7410}
      SANDBOX_INIT_SOCKET_DIR: ${SANDBOX_INIT_SOCKET_DIR:-/data/run/agent-compose}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - ${AGENT_COMPOSE_DATA_DIR:-./data}:/data
      - ./.env:/data/work/.env:ro
    working_dir: /data/work
    ports:
      - 127.0.0.1:7410:7410

  # fetch agent-compose-guest docker image only
  fetch-guest-image:
    image: ${DEFAULT_IMAGE:-chaitin/agent-compose-guest:latest}
    command: ["true"]
    restart: "no"

  agent-compose-ui:
    image: ${AGENT_COMPOSE_FRONTEND_IMAGE:-chaitin/agent-compose-ui:latest}
    container_name: agent-compose-ui
    profiles:
      - with-ui
    restart: always
    depends_on:
      - agent-compose
    env_file:
      - ./.env
    volumes:
      - ${AGENT_COMPOSE_UI_DATA_DIR:-./data/agent-compose-ui}:/data
      - ${AGENT_COMPOSE_DATA_DIR:-./data}/sandboxes:/data/sandboxes:ro
    environment:
      JUPYTER_PROXY_BASE: ${JUPYTER_PROXY_BASE:-/jupyter}
      NGINX_JUPYTER_PROXY_BASE: ${JUPYTER_PROXY_BASE:-/jupyter}
    ports:
      - "${AGENT_COMPOSE_HTTP_PORT:-80}:8000/tcp"

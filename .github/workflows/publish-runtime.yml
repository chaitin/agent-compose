name: Publish runtime packages

on:
  push:
    tags:
      - "runtime-v*"
  workflow_dispatch:

# Publishing authenticates through npm trusted publishing (GitHub OIDC), so no
# long-lived registry token is involved. The two publish jobs each request
# `id-token: write`; no other job needs it.
permissions:
  contents: read

jobs:
  verify:
    name: Verify runtime package versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        name: Verify shared runtime version
        run: |
          set -euo pipefail
          runtime_version="$(node -p "require('./runtime/javascript/package.json').version")"
          sdk_version="$(node -p "require('./runtime/agent-compose-runtime-sdk/package.json').version")"
          if [ "$runtime_version" != "$sdk_version" ]; then
            echo "::error::runtime package version '$runtime_version' does not match runtime-sdk package version '$sdk_version'"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#runtime-v}"
            if [ "$tag_version" != "$runtime_version" ]; then
              echo "::error::tag version '$tag_version' does not match runtime package version '$runtime_version'"
              exit 1
            fi
          fi
          echo "version=${runtime_version}" >> "$GITHUB_OUTPUT"

  publish-runtime:
    name: Publish @chaitin-ai/agent-compose-runtime
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: runtime/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11.x; trusted publishing (OIDC) requires npm >= 11.5.1.
          # Node 22 bundles npm 10.9.x, which predates trusted publishing entirely.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: runtime/javascript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - name: Check trusted publishing preconditions
        run: |
          npm_version="$(npm --version)"
          echo "npm version: $npm_version"
          if [ "$(printf '%s\n%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version predates trusted publishing; npm >= 11.5.1 is required (Node 24 bundles npm 11.x)"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::GitHub OIDC token endpoint is unavailable; this job needs 'permissions: id-token: write'"
            exit 1
          fi
      - id: published
        name: Check published version
        env:
          PACKAGE: "@chaitin-ai/agent-compose-runtime"
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$VERSION is already published; skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance

  publish-runtime-sdk:
    name: Publish @chaitin-ai/agent-compose-runtime-sdk
    needs: [verify, publish-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: runtime/agent-compose-runtime-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11.x; trusted publishing (OIDC) requires npm >= 11.5.1.
          # Node 22 bundles npm 10.9.x, which predates trusted publishing entirely.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: runtime/agent-compose-runtime-sdk/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:packaging
      - name: Check trusted publishing preconditions
        run: |
          npm_version="$(npm --version)"
          echo "npm version: $npm_version"
          if [ "$(printf '%s\n%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version predates trusted publishing; npm >= 11.5.1 is required (Node 24 bundles npm 11.x)"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::GitHub OIDC token endpoint is unavailable; this job needs 'permissions: id-token: write'"
            exit 1
          fi
      - id: published
        name: Check published version
        env:
          PACKAGE: "@chaitin-ai/agent-compose-runtime-sdk"
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$VERSION is already published; skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance

name: Refresh Protobuf compatibility approval

on:
  pull_request_review:
    types: [submitted, dismissed]

# Review events from a fork only ever receive a read-only token, so this
# workflow cannot rerun anything itself. It only filters the reviews that can
# change the approval and waits for the in-flight Buf run; the follow-up
# workflow in proto-compatibility-rerun.yml runs in the base repository through
# workflow_run and performs the rerun.
permissions:
  contents: read

# Share the required workflow's group so a review submitted while Buf is still
# running waits for that run to finish before requesting a new attempt.
concurrency:
  group: proto-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh-proto-breaking-approval:
    name: Refresh Protobuf compatibility approval
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action == 'dismissed' || github.event.review.state == 'approved' || github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    steps:
      - name: Request compatibility rerun for current commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'Approval changed on PR #%s at %s; proto-compatibility-rerun.yml reruns the compatibility check.\n' \
            "$PR_NUMBER" "$PR_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

name: Images & Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/images.yml
      - Dockerfile
      - deploy/**
      - docker-compose.yml
      - docker-compose.kvm.yml
      - docker-compose.override.yml
      - .env.example
      - guest-images/**
      - go.mod
      - go.sum
      - proto/**
      - buf.yaml
      - buf.gen.yaml
      - cmd/**
      - internal/**
      - pkg/**
      - assets/**
      - runtime/**
      - scripts/build-agent-compose-binary.sh
      - scripts/build-agent-compose.sh
      - scripts/build-agent-compose-guest.sh
      - scripts/provider-lock.sh
      - scripts/with-go-toolchain.sh
      - scripts/build-installer-assets.sh
      - scripts/test-image-docker-e2e.sh
      - scripts/tests/test-image-ci-contract.sh
      - scripts/tests/test-provider-lock.sh
      - scripts/verify-agent-compose-image.sh
      - scripts/verify-image-manifest.sh
      # Test-only and documentation changes do not alter the published images.
      - '!**/*_test.go'
      - '!**/*.test.ts'
      - '!**/*.test.js'
      - '!**/__tests__/**'
  push:
    branches:
      - main
    tags:
      - "*"
    # A merged commit that only touches documentation, examples, or tests cannot
    # change a published image, and the pull request that produced it already ran
    # this workflow. Path filters are not evaluated for tag pushes, so release
    # tags always publish.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "examples/**"
      - "charts/**"
      - "**/*_test.go"
      - "**/*.test.ts"
      - "**/*.test.js"
      - "**/__tests__/**"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded pull-request runs only. Pushes to main and tags publish
# images, so they must never be cancelled mid-flight (cancel-in-progress false).
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: chaitin
  REGISTRY_MIRROR: docker.io
  GOPROXY: https://proxy.golang.org,direct

jobs:
  # Emit the build matrix as JSON: amd64 only on pull requests (fast Dockerfile
  # validation), the full amd64 + arm64 set on pushes to main and tags where the
  # multi-arch manifest is published. Done in a job rather than a job-level `if`
  # because that `if` cannot read the matrix context, so the arm64 legs would
  # otherwise still be created (and only skipped) on PRs.
  setup:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Configure build matrix
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.json }}
      archlinux: ${{ steps.changes.outputs.archlinux }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate image CI contract
        run: ./scripts/tests/test-image-ci-contract.sh
      # The provider lock decides which versions a guest image bakes, so a guest
      # build must not start when the lock, the Dockerfiles, the build script, or
      # the generated ABI manifest disagree.
      - name: Validate the provider lock
        run: ./scripts/tests/test-provider-lock.sh
      # The Arch Linux guest Dockerfile bakes guest-image inputs only (assets,
      # runtime, guest-images); it does not compile the daemon. A pull request
      # that touches none of those inputs would rebuild and boot it for no
      # signal, so tell image-smoke whether the Arch Linux leg is meaningful.
      - id: changes
        name: Detect Arch Linux guest input changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            BASE_SHA=FETCH_HEAD
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if grep -Eq '^(assets/|guest-images/|runtime/|scripts/provider-lock\.sh$|\.github/workflows/images\.yml$)' <<<"$changed"; then
            echo "archlinux=true" >> "$GITHUB_OUTPUT"
          else
            echo "archlinux=false" >> "$GITHUB_OUTPUT"
          fi
      - id: platforms
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          amd64='{"tag":"linux/amd64","arch":"amd64","runner":"ubuntu-latest"}'
          arm64='{"tag":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"}'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "json=[$amd64]" >> "$GITHUB_OUTPUT"
          else
            echo "json=[$amd64,$arm64]" >> "$GITHUB_OUTPUT"
          fi

  # Build each image for a single architecture on a native runner, then push by
  # digest. Native arm64 runners avoid slow QEMU emulation of the Rust-based
  # microsandbox build stage. The manifest list is assembled in the merge job.
  #
  # Pull requests skip this job. Its only product is a pushed digest, and a pull
  # request publishes nothing, so the sole signal it carries there is "these
  # Dockerfiles build". The image-smoke job builds the same two Dockerfiles for
  # linux/amd64 with load: true, verifies the daemon image, and runs the Docker
  # lifecycle smoke, so keeping this job on pull requests compiles every image
  # twice for one signal.
  build:
    name: Build ${{ matrix.name }} (${{ matrix.platform.tag }})
    needs: setup
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        name: [agent-compose, agent-compose-guest]
        platform: ${{ fromJSON(needs.setup.outputs.platforms) }}
        include:
          - name: agent-compose
            image: agent-compose
            dockerfile: Dockerfile
            context: .
          - name: agent-compose-guest
            image: agent-compose-guest
            dockerfile: guest-images/Dockerfile.agent-compose-guest
            context: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERIO_USERNAME }}
          password: ${{ secrets.DOCKERIO_PASSWORD }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REGISTRY_MIRROR=${{ env.REGISTRY_MIRROR }}
            GOPROXY=${{ env.GOPROXY }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.platform.arch }}
      - name: Verify published daemon image digest
        if: matrix.name == 'agent-compose' && github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          TARGET_ARCH: ${{ matrix.platform.arch }}
        run: |
          docker pull "$IMAGE_REF"
          ./scripts/verify-agent-compose-image.sh \
            --image "$IMAGE_REF" \
            --arch "$TARGET_ARCH"
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}--${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The upstream Arch Linux base is x86_64-only, so publish this guest through
  # the same digest/tag pipeline as the default images but only for amd64.
  # Pull requests skip it for the same reason as the build matrix above: the
  # image-smoke job builds this Dockerfile and runs the Arch Linux guest
  # lifecycle against it.
  build-archlinux-guest:
    name: Build agent-compose-guest-archlinux (linux/amd64)
    needs: setup
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/agent-compose-guest
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERIO_USERNAME }}
          password: ${{ secrets.DOCKERIO_PASSWORD }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: guest-images/Dockerfile.agent-compose-guest-archlinux
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/agent-compose-guest,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          build-args: |
            REGISTRY_MIRROR=${{ env.REGISTRY_MIRROR }}
            GOPROXY=${{ env.GOPROXY }}
          cache-from: type=gha,scope=agent-compose-guest-archlinux-amd64
          cache-to: type=gha,mode=max,scope=agent-compose-guest-archlinux-amd64
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-agent-compose-guest-archlinux--amd64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Build loadable amd64 images independently from the push-by-digest matrix.
  # The smoke proves the published Dockerfile starts without KVM and completes
  # a real Docker-driver sandbox lifecycle through the public API.
  #
  # Pushes reuse the images the build matrix already pushed. Rebuilding them here
  # compiled the daemon a second time, and that compile is always cold because
  # the Dockerfile's Go build cache mount is not exported to the GHA cache
  # (moby/buildkit#3011). Pull requests publish nothing, so they still build the
  # Dockerfiles locally.
  image-smoke:
    name: Full image Docker smoke (linux/amd64)
    needs:
      - setup
      - build
      - build-archlinux-guest
    # The two build jobs are skipped on pull requests, so this job has to keep
    # running when its dependencies are skipped. `needs.setup.result` also
    # carries the draft-pull-request guard that used to skip this job through a
    # skipped dependency, and the explicit result checks preserve the push
    # ordering: a failed build still skips the smoke.
    if: >-
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled' &&
      needs.build-archlinux-guest.result != 'failure' && needs.build-archlinux-guest.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.68.1
      - name: Generate Protobuf sources
        run: buf generate
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERIO_USERNAME }}
          password: ${{ secrets.DOCKERIO_PASSWORD }}
      - name: Download the digests built for this commit
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-amd64
      - name: Pull the images built for this commit
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          digests="$RUNNER_TEMP/digests"
          digest_for() { # $1=digest artifact name suffix
            local file
            file="$(find "$digests/digests-$1" -maxdepth 1 -type f | head -n 1)"
            if [ -z "$file" ]; then
              echo "missing digest artifact digests-$1" >&2
              exit 1
            fi
            printf 'sha256:%s' "$(basename "$file")"
          }
          daemon="${IMAGE_PREFIX}/agent-compose@$(digest_for agent-compose--amd64)"
          guest="${IMAGE_PREFIX}/agent-compose-guest@$(digest_for agent-compose-guest--amd64)"
          archlinux="${IMAGE_PREFIX}/agent-compose-guest@$(digest_for agent-compose-guest-archlinux--amd64)"
          docker pull "$daemon"
          docker pull "$guest"
          docker pull "$archlinux"
          docker tag "$daemon" agent-compose:image-smoke
          docker tag "$guest" agent-compose-guest:image-smoke
          docker tag "$archlinux" agent-compose-guest:archlinux-image-smoke
      - name: Build loadable guest image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: guest-images/Dockerfile.agent-compose-guest
          platforms: linux/amd64
          load: true
          tags: agent-compose-guest:image-smoke
          build-args: |
            REGISTRY_MIRROR=${{ env.REGISTRY_MIRROR }}
            GOPROXY=${{ env.GOPROXY }}
          cache-from: type=gha,scope=agent-compose-guest-amd64
          cache-to: type=gha,mode=max,scope=agent-compose-guest-amd64
      - name: Build loadable Arch Linux guest image
        if: github.event_name == 'pull_request' && needs.setup.outputs.archlinux == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: guest-images/Dockerfile.agent-compose-guest-archlinux
          platforms: linux/amd64
          load: true
          tags: agent-compose-guest:archlinux-image-smoke
          build-args: |
            REGISTRY_MIRROR=${{ env.REGISTRY_MIRROR }}
            GOPROXY=${{ env.GOPROXY }}
          cache-from: type=gha,scope=agent-compose-guest-archlinux-amd64
          cache-to: type=gha,mode=max,scope=agent-compose-guest-archlinux-amd64
      - name: Build loadable full daemon image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: agent-compose:image-smoke
          build-args: |
            VERSION=ci-${{ github.sha }}
            REGISTRY_MIRROR=${{ env.REGISTRY_MIRROR }}
            GOPROXY=${{ env.GOPROXY }}
          cache-from: type=gha,scope=agent-compose-amd64
          cache-to: type=gha,mode=max,scope=agent-compose-amd64
      - name: Verify full daemon image
        run: |
          ./scripts/verify-agent-compose-image.sh \
            --image agent-compose:image-smoke \
            --arch amd64
      - name: Run default guest no-KVM Docker lifecycle smoke
        env:
          AGENT_COMPOSE_E2E_DAEMON_IMAGE: agent-compose:image-smoke
          AGENT_COMPOSE_E2E_GUEST_IMAGE: agent-compose-guest:image-smoke
          AGENT_COMPOSE_E2E_DOCKER_SOCKET: /var/run/docker.sock
          GOCACHE: ${{ github.workspace }}/.cache/go-build
        run: ./scripts/test-image-docker-e2e.sh
      - name: Run Arch Linux guest no-KVM Docker lifecycle smoke
        if: github.event_name != 'pull_request' || needs.setup.outputs.archlinux == 'true'
        env:
          AGENT_COMPOSE_E2E_DAEMON_IMAGE: agent-compose:image-smoke
          AGENT_COMPOSE_E2E_GUEST_IMAGE: agent-compose-guest:archlinux-image-smoke
          AGENT_COMPOSE_E2E_DOCKER_SOCKET: /var/run/docker.sock
          GOCACHE: ${{ github.workspace }}/.cache/go-build
        run: ./scripts/test-image-docker-e2e.sh

  # Combine each image variant's per-platform digests into its published manifest.
  merge:
    name: Merge ${{ matrix.artifact }} manifest
    if: github.event_name != 'pull_request'
    needs:
      - build
      - build-archlinux-guest
      - image-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent-compose
            artifact: agent-compose
            platforms: linux/amd64,linux/arm64
            tag_suffix: ""
            stable_tag: latest
          - image: agent-compose-guest
            artifact: agent-compose-guest
            platforms: linux/amd64,linux/arm64
            tag_suffix: ""
            stable_tag: latest
          - image: agent-compose-guest
            artifact: agent-compose-guest-archlinux
            platforms: linux/amd64
            tag_suffix: -archlinux
            stable_tag: archlinux
    steps:
      - uses: actions/checkout@v4
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.artifact }}--*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # Stable tags are selected explicitly below. The action's automatic
          # latest flavor would otherwise publish latest for every Git tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }}
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=sha,prefix=sha-,suffix=${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.stable_tag }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERIO_USERNAME }}
          password: ${{ secrets.DOCKERIO_PASSWORD }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          image="${{ env.IMAGE_PREFIX }}/${{ matrix.image }}"
          digests=(*)
          if [[ "${digests[0]}" == "*" ]]; then
            echo "No digest artifacts were downloaded for ${image}" >&2
            exit 1
          fi

          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${image}@sha256:${digest}")
          done

          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${refs[@]}"
      - name: Verify published image manifest
        run: |
          ./scripts/verify-image-manifest.sh \
            --image ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.version }} \
            --platforms ${{ matrix.platforms }}

  # Arbitrary tags stop after publishing images. Only version tags publish the
  # installer assets and create a GitHub Release.
  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - merge
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Build installer assets
        env:
          VERSION: ${{ github.ref_name }}
          AGENT_COMPOSE_FRONTEND_VERSION: ${{ vars.AGENT_COMPOSE_FRONTEND_VERSION || 'latest' }}
          AGENT_COMPOSE_FRONTEND_VERSIONS: ${{ vars.AGENT_COMPOSE_FRONTEND_VERSIONS || vars.AGENT_COMPOSE_FRONTEND_VERSION || 'latest' }}
        run: ./scripts/build-installer-assets.sh ./upload
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" upload/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" upload/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "agent-compose ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

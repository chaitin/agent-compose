<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-compose chat</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --line: #e6e4e0; --ink: #1c1b19;
    --muted: #78736c; --accent: #2f6f4f; --user: #eef2f7; --tool: #f6f5f3;
    --danger: #a5352b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1d1f23; --line: #2e3238; --ink: #e9e7e4;
      --muted: #9a958d; --accent: #6fb894; --user: #23272e; --tool: #202329;
      --danger: #e08a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         background: var(--bg); color: var(--ink);
         font: 14px/1.6 ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 14px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  select, button, textarea {
    font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 20px 0; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
  .row { display: flex; margin-bottom: 14px; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 86%; padding: 10px 14px; border-radius: 12px;
            background: var(--panel); border: 1px solid var(--line);
            white-space: pre-wrap; word-break: break-word; }
  .row.user .bubble { background: var(--user); }
  .row.note .bubble { background: transparent; border: 0; color: var(--muted);
                      font-size: 12px; margin: 0 auto; text-align: center; }
  .tool { margin: 6px 0; padding: 6px 10px; border-radius: 8px; background: var(--tool);
          border: 1px solid var(--line); font-family: ui-monospace, SFMono-Regular, monospace;
          font-size: 12px; color: var(--muted); }
  .tool.failed { color: var(--danger); border-color: var(--danger); }
  .tool pre { margin: 6px 0 0; white-space: pre-wrap; max-height: 160px; overflow: auto; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 0; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; max-height: 160px; }
</style>
</head>
<body>
<header>
  <select id="agent"><option value="">加载中…</option></select>
  <button id="new">新会话</button>
  <button id="delete">删除会话</button>
  <span id="status">就绪</span>
</header>

<main><div class="wrap" id="chat"></div></main>

<footer><div class="wrap">
  <form id="composer">
    <textarea id="text" rows="1" placeholder="说点什么…  (Enter 发送, Shift+Enter 换行)"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
</div></footer>

<script>
const chat = document.getElementById("chat");
const agentSelect = document.getElementById("agent");
const statusEl = document.getElementById("status");
const textArea = document.getElementById("text");
const sendBtn = document.getElementById("send");

let socket = null;
let conversationId = null;
let turn = null;   // the assistant bubble and tool cards of the turn in flight

const setStatus = (text) => { statusEl.textContent = text; };
const scroll = () => { chat.parentElement.parentElement.scrollTop = 1e9; };

function addRow(kind) {
  const row = document.createElement("div");
  row.className = "row " + kind;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  row.appendChild(bubble);
  chat.appendChild(row);
  scroll();
  return bubble;
}

const addNote = (text) => { addRow("note").textContent = text; };

function setBusy(busy) {
  sendBtn.textContent = busy ? "停止" : "发送";
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!response.ok) throw new Error((await response.text()).trim() || response.statusText);
  return response.status === 204 ? null : response.json();
}

async function loadAgents() {
  try {
    const { projects } = await api("GET", "/api/agents");
    agentSelect.innerHTML = "";
    for (const project of projects) {
      for (const agent of project.agents) {
        const option = document.createElement("option");
        option.value = JSON.stringify({ projectId: project.projectId, agentName: agent });
        option.textContent = `${project.name} / ${agent}`;
        agentSelect.appendChild(option);
      }
    }
    setStatus(agentSelect.options.length ? "就绪" : "没有可用的 agent");
  } catch (error) {
    setStatus("加载 agent 失败: " + error.message);
  }
}

// Opens the conversation socket. Every turn on the conversation arrives here,
// including turns another client started and one already running when this
// page connected, so the UI renders from the socket rather than from what it
// just sent.
function connect(id) {
  if (socket) { socket.onclose = null; socket.close(); }
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  socket = new WebSocket(`${scheme}//${location.host}/api/conversations/${id}/socket`);
  socket.onopen = () => setStatus("已连接");
  socket.onclose = () => { setStatus("连接已断开"); setBusy(false); };
  socket.onerror = () => setStatus("连接出错");
  socket.onmessage = (message) => handle(JSON.parse(message.data));
}

function handle(frame) {
  switch (frame.type) {
    case "turn_started": {
      if (frame.prompt) addRow("user").textContent = frame.prompt;
      const bubble = addRow("assistant");
      bubble.classList.add("cursor");
      turn = { bubble, cards: new Map(), text: "" };
      setBusy(true);
      break;
    }
    case "event":
      if (turn) renderEvent(turn, frame.event);
      break;
    case "turn_done":
      if (turn) {
        turn.bubble.classList.remove("cursor");
        if (!turn.text) turn.bubble.textContent = frame.text;
      }
      // A turn that lost its environment must say so: the agent no longer has
      // the context the earlier turns built up.
      if (frame.continuity === "restarted") {
        addNote("上下文已重置——这个会话的运行环境被重建了");
      }
      turn = null;
      setBusy(false);
      break;
    case "stopped":
      if (frame.contextLost) addNote("已停止。下一条消息会重建环境，agent 不再记得之前的上下文");
      break;
    case "error":
      if (turn) turn.bubble.classList.remove("cursor");
      addNote("错误: " + frame.message);
      turn = null;
      setBusy(false);
      break;
  }
}

function renderEvent(state, event) {
  switch (event.kind) {
    case "text_delta":
      state.text += event.text;
      state.bubble.textContent = state.text;
      scroll();
      break;
    case "tool_call":
    case "tool_result":
      renderTool(state, event);
      break;
    case "usage":
      setStatus(`${event.scope}: ${event.inputTokens} in / ${event.outputTokens} out`);
      break;
    case "retry":
      addNote(`重试 (${event.reason}, 第 ${event.attempt} 次)`);
      break;
  }
}

// Tool cards are keyed by tool call ID so a result lands on the card its call
// created.
function renderTool(state, event) {
  let card = state.cards.get(event.id);
  if (!card) {
    card = document.createElement("div");
    card.className = "tool";
    state.bubble.parentElement.insertBefore(card, state.bubble);
    state.cards.set(event.id, card);
  }
  if (event.kind === "tool_call") {
    card.textContent = `${event.toolKind} · ${event.name}` + (event.command ? `: ${event.command}` : "");
  } else {
    if (!event.ok) card.classList.add("failed");
    if (event.output) {
      const pre = document.createElement("pre");
      pre.textContent = event.output;
      card.appendChild(pre);
    }
  }
  scroll();
}

async function ensureConversation() {
  if (conversationId) return conversationId;
  if (!agentSelect.value) throw new Error("先选一个 agent");
  const { id } = await api("POST", "/api/conversations", JSON.parse(agentSelect.value));
  conversationId = id;
  addNote("会话 " + id);
  connect(id);
  // Wait for the socket before the first message, so the turn it starts is not
  // missed.
  await new Promise((resolve, reject) => {
    if (socket.readyState === WebSocket.OPEN) return resolve();
    socket.addEventListener("open", resolve, { once: true });
    socket.addEventListener("error", reject, { once: true });
  });
  return id;
}

document.getElementById("composer").addEventListener("submit", async (submitEvent) => {
  submitEvent.preventDefault();
  if (turn) {
    socket?.send(JSON.stringify({ type: "stop" }));
    return;
  }
  const text = textArea.value.trim();
  if (!text) return;
  textArea.value = "";
  textArea.style.height = "auto";
  try {
    await ensureConversation();
    socket.send(JSON.stringify({ type: "message", text }));
  } catch (error) {
    addNote("发送失败: " + error.message);
  }
});

textArea.addEventListener("input", () => {
  textArea.style.height = "auto";
  textArea.style.height = Math.min(textArea.scrollHeight, 160) + "px";
});
textArea.addEventListener("keydown", (keyEvent) => {
  if (keyEvent.key === "Enter" && !keyEvent.shiftKey) {
    keyEvent.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
});

document.getElementById("new").addEventListener("click", () => {
  if (socket) { socket.onclose = null; socket.close(); socket = null; }
  conversationId = null;
  turn = null;
  chat.innerHTML = "";
  setBusy(false);
  setStatus("就绪");
});

document.getElementById("delete").addEventListener("click", async () => {
  if (!conversationId) return;
  try {
    await api("DELETE", `/api/conversations/${conversationId}`);
    if (socket) { socket.onclose = null; socket.close(); socket = null; }
    addNote("会话已删除");
    conversationId = null;
  } catch (error) {
    addNote("删除失败: " + error.message);
  }
});

agentSelect.addEventListener("change", () => {
  if (socket) { socket.onclose = null; socket.close(); socket = null; }
  conversationId = null;
  chat.innerHTML = "";
});

loadAgents();
</script>
</body>
</html>

# Docker-mode sandbox network isolation overlay.
#
# It creates a dedicated `agent-compose-sandbox` network and dual-homes the
# daemon onto it, so sandbox containers can be kept off the daemon's own
# network. The daemon stays on its original network; the Docker driver places
# sandboxes on the dedicated network only when DOCKER_SANDBOX_NETWORK is set.
# `container_name: agent-compose` resolves on every network the container joins,
# so the default AGENT_COMPOSE_RUNTIME_BASE_URL (http://agent-compose:7410)
# keeps reaching the daemon from the sandbox network.
#
# Enable it by setting, in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.sandbox-network.yml
#   DOCKER_SANDBOX_NETWORK=agent-compose-sandbox
#
# Docker-driver deployments only: BoxLite and Microsandbox sandboxes are
# microVMs that share the sandbox-host network namespace, so this overlay does
# not apply to them and cannot be combined with docker-compose.kvm.yml.
services:
  agent-compose:
    networks:
      - default
      - sandbox

networks:
  sandbox:
    # Fixed physical name: Compose would otherwise call it <project>_sandbox,
    # which changes with the directory or -p flag, while DOCKER_SANDBOX_NETWORK
    # must be a stable Docker network name.
    name: agent-compose-sandbox

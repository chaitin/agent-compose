# One project policy per audience, selected by name.
#
# `policies` is the project's policy library: each entry is a policy block, and
# an agent selects one with `policy: <name>` instead of repeating the block. A
# block declared inline works the same way; the two forms normalize to the same
# specification and the same spec hash, so moving a shared block into the
# library changes nothing the engine enforces.
name: docker-policy-library

policies:
  # Default-deny egress for the review agent. On the Docker driver the engine
  # refuses to create the sandbox rather than run it with unrestricted egress,
  # so this policy is a deliberate deployment boundary: use it on a driver whose
  # capability report says strength=allowlist (Microsandbox), or drop
  # `default: deny-all` to keep egress unrestricted while still hashing the intent.
  locked-down:
    network:
      default: deny-all
      allow:
        - host: api.github.com
          port: 443

  # Retain the stopped runtime so the next run resumes the same container.
  # Named for what it does to the stopped runtime: `stopped_runtime_policy:
  # retain`. It does not keep the sandbox running, which is a different control
  # (`scheduler.sandbox_policy: sticky`).
  retained-runtime:
    stopped_runtime_policy: retain

agents:
  reviewer:
    provider: codex
    image: agent-compose-guest:latest
    policy: locked-down
    driver:
      docker: {}

  builder:
    provider: codex
    image: agent-compose-guest:latest
    policy: retained-runtime
    driver:
      docker: {}

  # The same declaration without the library: a single agent that needs its own
  # policy does not have to name one.
  adhoc:
    provider: codex
    image: agent-compose-guest:latest
    policy:
      network:
        default: allow-all
    driver:
      docker: {}
